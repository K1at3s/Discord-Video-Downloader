name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: CodeQL başlat
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Otomatik derleme
        uses: github/codeql-action/autobuild@v3

      - name: Analiz
        uses: github/codeql-action/analyze@v3
