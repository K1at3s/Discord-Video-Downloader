name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v7

      - name: CodeQL başlat
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Otomatik derleme
        uses: github/codeql-action/autobuild@v4

      - name: Analiz
        uses: github/codeql-action/analyze@v4
