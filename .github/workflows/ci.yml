name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Aynı dal için yeni bir çalıştırma başlarsa öncekini iptal et: kuyruğu ve
# dakika tüketimini azaltır.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        python-version: [ "3.12" ]
    steps:
      - name: Depoyu indir
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python kurulumu
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage ruff

      - name: Ruff denetimi
        run: ruff check media_bot tests scripts

      - name: Testleri çalıştır
        env:
          PYTHONIOENCODING: utf-8
        run: |
          coverage run -m unittest discover -s tests -q
          coverage report -m

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu indir
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python kurulumu
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: pip-audit kurulumu
        run: python -m pip install --upgrade pip pip-audit

      - name: Bilinen güvenlik açıklarını denetle
        run: pip-audit -r requirements.txt --progress-spinner off
