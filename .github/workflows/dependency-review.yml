name: Dependency review

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu indir
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Dependency review, depo ayarlarında "Dependency graph" açık değilse
      # GitHub API'sinden 403 alır. Grafiği yoklayıp denetimi yalnızca hazır
      # olduğunda çalıştırıyoruz; böylece PR'lar gereksiz yere kırmızı olmaz.
      - name: Dependency graph hazır mı?
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" > /dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Dependency graph açık; bağımlılık denetimi çalışacak."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dependency graph kapalı. Settings > Code security bölümünden açıldığında bu denetim otomatik devreye girer."
          fi

      - name: Bağımlılık değişikliklerini denetle
        if: steps.graph.outputs.ready == 'true'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
