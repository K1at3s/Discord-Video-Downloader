name: Dependency review

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v7

      - name: Bağımlılık değişikliklerini denetle
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
